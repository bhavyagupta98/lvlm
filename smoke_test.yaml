apiVersion: v1
kind: Pod
metadata:
  name: gpu-smoke
  namespace: seelab
spec:
  restartPolicy: Never
  containers:
  - name: test
    image: nvidia/cuda:12.3.2-base-ubuntu22.04
    command: ["/bin/bash", "-lc"]
    args:
      - |
        echo "Running nvidia-smi..."
        nvidia-smi
        sleep 5
    resources:
      limits:
        nvidia.com/gpu: 1