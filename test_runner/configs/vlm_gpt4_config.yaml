# Example configuration with OpenAI GPT-4 Vision
# Set your OpenAI API key: export OPENAI_API_KEY="sk-..."

agent:
  name: "vlm_agent_gpt4"

camera:
  width: 800
  height: 600
  fov: 100.0

control:
  max_speed: 25.0
  target_speed: 8.0
  pid:
    throttle:
      kp: 0.6
      ki: 0.15
      kd: 0.1
    steering:
      kp: 0.9
      ki: 0.08
      kd: 0.08

planning:
  method: "vlm_speed_planning"
  update_frequency: 5  # Hz (slower for VLM)

perception:
  sensors:
    - camera
    - imu

# Enable VLM with OpenAI
vlm:
  enabled: true
  type: "openai"
  api_key: "${OPENAI_API_KEY}"              # Use env var
  api_base_url: "https://api.openai.com/v1"
  model: "gpt-4-vision"
  max_tokens: 10
  temperature: 0.3
