# Example configuration with OpenRouter (multi-model support)
# Set your OpenRouter API key: export OPENROUTER_API_KEY="sk-or-..."
# https://openrouter.ai

agent:
  name: "vlm_agent_openrouter"

camera:
  width: 800
  height: 600
  fov: 100.0

control:
  max_speed: 25.0
  target_speed: 8.0
  pid:
    throttle:
      kp: 0.6
      ki: 0.15
      kd: 0.1
    steering:
      kp: 0.9
      ki: 0.08
      kd: 0.08

planning:
  method: "vlm_speed_planning"
  update_frequency: 5

perception:
  sensors:
    - camera
    - imu

# Enable VLM with OpenRouter
vlm:
  enabled: true
  type: "openrouter"
  api_key: "${OPENROUTER_API_KEY}"
  api_base_url: "https://openrouter.ai/api/v1"
  
  # Choose from available models:
  # model: "openai/gpt-4-vision"          # GPT-4 Vision (via OpenRouter)
  # model: "anthropic/claude-3.5-sonnet"  # Claude 3.5 Sonnet
  # model: "google/gemini-2.0-pro-vision" # Gemini 2.0 Pro
  # model: "meta-llama/llama-2-vision"    # Llama 2 Vision
  model: "openai/gpt-4-vision"
  
  max_tokens: 10
  temperature: 0.3
